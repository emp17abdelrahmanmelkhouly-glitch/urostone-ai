<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="kidneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer Pulsing Radii Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.25" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.35" />

  <!-- Stylized Kidney & Urinary Tract -->
  <path d="M 170,140 C 100,140 90,270 170,290 C 210,300 230,275 220,240 C 215,220 215,200 225,180 C 235,150 205,140 170,140 Z" 
        fill="url(#kidneyGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Ureter Flow Line -->
  <path d="M 220,240 Q 240,320 270,360 T 320,400" 
        fill="none" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round" opacity="0.7" />
  <path d="M 220,240 Q 240,320 270,360 T 320,400" 
        fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" />

  <!-- Calculus Crystal Facet (Stone) -->
  <g transform="translate(305, 305)" filter="url(#neon)">
    <!-- Faceted Hexagonal Gemstone -->
    <polygon points="0,-42 36,-18 36,24 0,46 -36,24 -36,-18" fill="url(#crystalGrad)" stroke="#fef3c7" stroke-width="3" />
    <polygon points="0,-42 0,46 36,24" fill="#f59e0b" opacity="0.6" />
    <polygon points="0,-42 -36,-18 0,0" fill="#fde68a" opacity="0.7" />
    <polygon points="0,0 36,-18 36,24" fill="#d97706" opacity="0.4" />
  </g>

  <!-- AI Neural Interconnect Nodes -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.8">
    <line x1="170" y1="210" x2="256" y2="170" />
    <line x1="256" y1="170" x2="350" y2="190" />
    <line x1="350" y1="190" x2="305" y2="305" />
    <line x1="256" y1="170" x2="305" y2="305" />
    <line x1="170" y1="210" x2="305" y2="305" />
  </g>

  <circle cx="170" cy="210" r="7" fill="#38bdf8" />
  <circle cx="256" cy="170" r="9" fill="#60a5fa" filter="url(#neon)" />
  <circle cx="350" cy="190" r="7" fill="#38bdf8" />

  <!-- Brand Typography Arc -->
  <text x="256" y="468" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="4">
    UROSTONE<tspan fill="#38bdf8">.AI</tspan>
  </text>
  <text x="256" y="492" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    EAU CLINICAL WORKSTATION
  </text>
</svg>
